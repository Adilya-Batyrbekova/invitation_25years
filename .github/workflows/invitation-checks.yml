name: Invitation checks
on:
  push:
    paths: ['invitation/**', '.github/workflows/invitation-checks.yml']
  pull_request:
    paths: ['invitation/**', '.github/workflows/invitation-checks.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invitation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: invitation/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
