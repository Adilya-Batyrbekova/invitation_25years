name: Publish invitation to Pages
on:
  push:
    branches: [main]
    paths: ['invitation/**', '.github/workflows/invitation-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: invitation-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: invitation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: invitation/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build:pages
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: invitation/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
